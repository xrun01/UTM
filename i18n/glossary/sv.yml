# sv 定下的译法。规则见 i18n/glossary/terms.yml。
# 来源：amalthea（VM64 官网）的 glossary/sv.yml，commit b724790。去掉了官网专用的 ui-* 术语。
virtual-machine: virtuell maskin；复数 virtuella maskiner
guest: gäst；客户机系统 = gästsystem，客户机工具 = gästverktyg
emulate: emulera；emulering
virtualize: virtualisera；virtualisering
native: native；接近原生的速度 = nästan native hastighet
architecture: arkitektur
backend: backend；复数 backends；QEMU-backend、Apple-backend
apple-silicon: Apple-chip；Apple 芯片的 Mac = Mac med Apple-chip，复数 Mac-datorer med Apple-chip  # https://support.apple.com/sv-se/116943
intel-mac: Mac med Intel-processor；复数 Mac-datorer med Intel-processor  # https://support.apple.com/sv-se/116943
snapshot: ögonblicksbild；复数 ögonblicksbilder
disposable-mode: engångsläge
shut-down: stänga av；名词 avstängning
new-vm-wizard: assistenten för nya virtuella maskiner
installer-image: installationsavbildning
license: licens
secure-boot: säker start  # https://support.microsoft.com/sv-se/windows/windows-11-and-secure-boot-a8ff1202-c0d9-42f5-940f-843abef64fad
or-later: eller senare  # https://support.apple.com/sv-se/102552（「macOS Ventura eller senare」）
experimental: experimentell funktion
auto-resolution: automatisk justering av upplösningen
shared-clipboard: delat urklipp；共享剪贴板（动作）= dela urklippet；粘贴 = klistra in  # https://support.apple.com/sv-se/guide/mac-help/mchlp1012/mac（「Kopiera och klistra in mellan enheter」）
shared-folder: delad mapp；共享文件夹（动作）= dela mappar
sharing: Delning
shared-network: Delat nätverk
host-only: Endast värd
bridged: Bryggat
emulated-vlan: Emulerat VLAN
port-forwarding: portvidarebefordran
lan: lokalt nätverk
shortcuts: Genvägar  # https://support.apple.com/sv-se/guide/shortcuts-mac/welcome/mac
command-line-tool: kommandoradsverktyg
clone: klona
fingerprint: fingeravtryck
hardware-reset: hårdvaruåterställning
mount: montera
shared-library: delat bibliotek；复数 delade bibliotek
capture-mouse: fånga musen；捕获鼠标按钮 = knappen Fånga mus
keys: Kontroll-tangenten、Alternativtangenten；同时写 2 个键 = Kontroll- och Alternativtangenten  # https://support.apple.com/sv-se/102650
toolbar: verktygsfält
settings: inställningar
classic-systems: klassiska system
