# hr 定下的译法。键是 i18n/glossary/terms.yml 的术语 id。
# 来源：amalthea（VM64 官网）的 glossary/hr.yml，commit b724790。去掉了官网专用的 ui-* 术语。
virtual-machine: virtualni stroj（不写 virtualno računalo）
guest: gostujući；客户机系统 = gostujući sustav；客户机工具 = alati za gostujući sustav
emulate: emulirati；emulacija（不写 simulirati）
virtualize: virtualizirati；virtualizacija
native: izvorni；接近原生的速度 = gotovo izvorna brzina
architecture: arhitektura；CPU 架构 = CPU arhitektura
backend: backend；QEMU 后端 = QEMU backend，Apple 后端 = Apple backend（不写 pozadina）
apple-silicon: čip Apple Silicon；Apple 芯片的 Mac = Mac računalo s čipom Apple Silicon  # https://support.apple.com/hr-hr/102527
intel-mac: Mac računalo s Intelovim procesorom  # https://support.apple.com/hr-hr/116943（「Mac s Intelovim procesorom」）
snapshot: snimka；复数 snimke
disposable-mode: jednokratni način rada
shut-down: isključivanje
new-vm-wizard: čarobnjak za stvaranje virtualnih strojeva
installer-image: instalacijska slika
license: licenca；自备许可证 = vlastita licenca
secure-boot: sigurno pokretanje  # https://support.microsoft.com/hr-hr/windows/windows-11-and-secure-boot-a8ff1202-c0d9-42f5-940f-843abef64fad
or-later: ili noviji  # https://support.apple.com/hr-hr/102552（「macOS Ventura ili noviji」）
experimental: eksperimentalna značajka
auto-resolution: automatsko prilagođavanje rezolucije
shared-clipboard: dijeljeni međuspremnik；共享剪贴板（动作）= dijeljenje međuspremnika  # https://support.apple.com/hr-hr/102650
shared-folder: dijeljena mapa
sharing: dijeljenje
shared-network: Dijeljena mreža
host-only: Samo host
bridged: Premoštena mreža
emulated-vlan: Emulirani VLAN
port-forwarding: prosljeđivanje portova
lan: lokalna mreža（不写 LAN）
shortcuts: aplikacija Prečaci  # https://support.apple.com/hr-hr/guide/shortcuts-mac/welcome/mac
command-line-tool: alat naredbenog retka
clone: klonirati
fingerprint: otisak（不写 otisak prsta）
hardware-reset: resetiranje hardvera
mount: montirati
shared-library: dijeljena biblioteka
capture-mouse: uhvatiti miš；捕获鼠标按钮 = gumb „Uhvati miš”
keys: tipka Control、tipka Option  # https://support.apple.com/hr-hr/102650
toolbar: alatna traka
settings: postavke
classic-systems: klasični sustavi
cpu: CPU（保留；30 多种 CPU = više od 30 vrsta CPU-a；CPU 核心 = CPU jezgra）
rosetta: Rosetta（按 Apple hr 变格：Rosettu、Rosette）  # https://support.apple.com/hr-hr/102527
