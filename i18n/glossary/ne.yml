# ne 定下的译法。规则见 i18n/glossary/terms.yml。
# 来源：amalthea（VM64 官网）的 glossary/ne.yml，commit b724790。去掉了官网专用的 ui-* 术语。
# Apple 没有尼泊尔语网站和支持页（support.apple.com/ne-np 跳转到英文）。Microsoft 尼泊尔语支持页显示英文。
# rule 是 apple、microsoft 的术语按尼泊尔语软件界面的通行说法定，Apple 产品名参照 hi 的 Apple 写法结构，均待母语者确认。
# 数字一律用阿拉伯数字，不用天城文数字。
virtual-machine: भर्चुअल मेसिन
guest: गेस्ट；客户机系统 = गेस्ट प्रणाली，客户机工具 = गेस्ट टुल（不用 ग्राहक、क्लाइन्ट、अतिथि）
emulate: इमुलेट गर्नु；इमुलेशन（不用 अनुकरण、सिमुलेट）
virtualize: भर्चुअलाइज गर्नु；भर्चुअलाइजेशन
native: नेटिभ；接近原生的速度 = लगभग नेटिभ गति（不用 स्वदेशी、देशी）
architecture: आर्किटेक्चर（不用 संरचना、वास्तुकला）
backend: ब्याकएन्ड；QEMU ब्याकएन्ड，Apple ब्याकएन्ड（不写 ब्याकइन्ड）
apple-silicon: Apple silicon；Apple 芯片的 Mac = Apple silicon भएको Mac（不音译成 सिलिकन，不用 चिप）  # 无 Apple 尼泊尔语来源，参照 hi 的 Apple 写法 https://support.apple.com/hi-in/guide/mac-help/mchl82829c17/mac，待母语者确认
intel-mac: Intel-आधारित Mac（不加英文复数 s）  # 无 Apple 尼泊尔语来源，参照 hi 的 Apple 写法 https://support.apple.com/hi-in/guide/mac-help/mchl338cf9a8/mac
cpu: CPU（不音译）
rosetta: Rosetta
snapshot: स्न्यापसट（不写 स्न्यापशट）
disposable-mode: डिस्पोजेबल मोड（不用 एक-शट、थ्रोअवे）
shut-down: बन्द गर्नु；关机后 = बन्द गरेपछि
new-vm-wizard: भर्चुअल मेसिन सिर्जना गर्ने विजार्ड
installer-image: इन्स्टलर इमेज（不用 छवि，छवि 是图片）
license: लाइसेन्स；自备许可证 = लाइसेन्स आफैँ लिनुपर्छ
secure-boot: सुरक्षित बुट  # 无 Microsoft 尼泊尔语来源，沿用原译，待母语者确认
or-later: वा पछिको संस्करण（不用 वा उच्च、वा माथिको）  # 无 Apple 尼泊尔语来源，待母语者确认
experimental: प्रयोगात्मक सुविधा
auto-resolution: स्वचालित रिजोल्युसन समायोजन
shared-clipboard: साझा क्लिपबोर्ड；共享剪贴板（动作）= क्लिपबोर्ड साझेदारी गर्नु
shared-folder: साझा फोल्डर；共享文件夹（动作）= फोल्डर साझेदारी गर्नु
sharing: साझेदारी
shared-network: साझा नेटवर्क
host-only: होस्ट मात्र
bridged: ब्रिज्ड（不用 ब्रिज）
emulated-vlan: इमुलेटेड VLAN（不用 सिमुलेटेड VLAN）
port-forwarding: पोर्ट फर्वार्डिङ
lan: स्थानीय नेटवर्क（不用 ल्यान、LAN）
shortcuts: सर्टकट；正文写 सर्टकट एप，和键盘快捷键区分  # 无 Apple 尼泊尔语来源，参照 hi、mr 的 Apple 写法，待母语者确认
command-line-tool: कमान्ड-लाइन टुल
clone: क्लोन गर्नु
fingerprint: फिंगरप्रिन्ट
hardware-reset: हार्डवेयर रिसेट
mount: माउन्ट गर्नु
shared-library: साझा लाइब्रेरी（不用 पुस्तकालय，पुस्तकालय 是实体图书馆）
capture-mouse: माउस क्याप्चर गर्नु；捕获鼠标按钮 = माउस क्याप्चर बटन
keys: Control कुञ्जी、Option कुञ्जी（键名保留键帽上的英文，不意译成 विकल्प）  # 无 Apple 尼泊尔语来源，待母语者确认
toolbar: उपकरणपट्टी
settings: सेटिङहरू
classic-systems: क्लासिक प्रणाली
device: यन्त्र（不用 उपकरण，उपकरण 也指「工具」）
window: सञ्झ्याल（不用 विन्डो）
save: बचत गर्नु

# 审校待审条目时新定的界面术语（出现 3 次以上，terms.yml 没有）
host: होस्ट
image: इमेज；disk image = डिस्क इमेज，drive image = ड्राइभ इमेज（不用 छवि，छवि 是图片）
drive: ड्राइभ
display: डिस्प्ले
directory: डाइरेक्टरी；shared directory = साझा डाइरेक्टरी（不用 निर्देशिका）
storage: भण्डारण；和 memory 区分
memory: मेमोरी
vm: VM（不音译）
data: डाटा（不写 डेटा）
install: स्थापना गर्नु；installer = इन्स्टलर（不用 स्थापनाकर्ता，那是安装人员）
import: आयात गर्नु
delete: मेटाउनु（永久删除）
remove: हटाउनु（移除快捷方式、共享目录），和 delete 区分
read-only: पढ्ने मात्र（不加连字符）
recovery: रिकभरी；recovery mode = रिकभरी मोड
start: सुरु गर्नु；状态 Starting = सुरु हुँदै，Started = सुरु भएको
stop: रोक्नु；状态 Stopping = रोकिँदै，Stopped = रोकिएको
pause: पज गर्नु；Paused = पज गरिएको，Pausing = पज हुँदै（和 Stop 区分）
suspend: निलम्बन गर्नु；Suspended = निलम्बित，suspended state = निलम्बित अवस्था（和 pause 区分）
resume: पुनः सुचारु गर्नु；Resuming = पुनः सुचारु हुँदै（不用 पुनः सुरु गर्नु，那是重启）
restart: पुनः सुरु गर्नु
restore: पुनर्स्थापना गर्नु；Restoring = पुनर्स्थापना हुँदै（从快照恢复，和 resume 区分）
again: पुनः（用天城文止音符 ः U+0903，不用 ASCII 冒号写成 पुन:）
kill: अन्त्य गर्नु；force kill = बलपूर्वक अन्त्य गर्नु（不用 मार्नु）
force: बलपूर्वक（不用 बल、जबरजस्ती）
overwrite: अधिलेखन गर्नु
share: साझेदारी गर्नु（动作）；share（名词）= साझेदारी（不用 सेयर）
power-down: पावर डाउन
state: अवस्था（虚拟机状态、快照状态；不用 राज्य、स्थिति）
status: स्थिति（Status 标签、Get Virtual Machine Status）
position: स्थान（鼠标坐标；和 status 的 स्थिति 区分）
operation: सञ्चालन（不用 अपरेशन）
invalid: अमान्य（不用 अवैध）
icon: आइकन（不用 प्रतिमा）
path: पथ（不用 मार्ग）
size: आकार（不用 साइज）；resize = आकार बदल्नु
app: एप（不用 अनुप्रयोग）
keystroke: किस्ट्रोक（不用 कुञ्जी स्ट्रोक）
serial: सिरियल（串口设备；不用 क्रमिक，那是序号）
update: अद्यावधिक गर्नु（不用 अपडेट）
corrupt: बिग्रनु、बिगार्नु（数据损坏；不用 भ्रष्ट、भ्रष्टाचार，那是贪污腐败）
you: तपाईं（标准拼法；不写 तपाइँ、तपाईँ）
macos-ui-names: Finder、Dock、Virtual Machine Accessories、Device Support 保留英文（macOS 没有尼泊尔语界面，用户看到的是英文名）
