# cs 定下的译法。键是 i18n/glossary/terms.yml 的术语 id。
# 来源：amalthea（VM64 官网）的 glossary/cs.yml，commit b724790。去掉了官网专用的 ui-* 术语。
virtual-machine: virtuální počítač（不用 virtuální stroj）
guest: host；客户机系统 = hostovaný systém（不用 hostující，它表示宿主）；客户机工具 = nástroje pro hosta
emulate: emulovat；emulace（不用 simulovat）
virtualize: virtualizovat；virtualizace
native: nativní（不用 přirozený）
architecture: architektura
backend: backend
apple-silicon: čip Apple；Apple 芯片的 Mac = Mac s čipem Apple  # https://support.apple.com/cs-cz/116943
intel-mac: Mac s procesorem Intel  # https://support.apple.com/cs-cz/116943
snapshot: snímek
disposable-mode: jednorázový režim
shut-down: vypnout；vypnutí
new-vm-wizard: průvodce vytvořením virtuálního počítače
installer-image: instalační obraz
license: licence
secure-boot: zabezpečené spouštění  # https://support.microsoft.com/cs-cz/windows/windows-11-and-secure-boot-a8ff1202-c0d9-42f5-940f-843abef64fad
or-later: nebo novější（不用 vyšší）  # https://support.apple.com/cs-cz/102552（「macOS Ventura nebo novější」）
experimental: experimentální funkce
auto-resolution: automatická úprava rozlišení
shared-clipboard: sdílená schránka；共享剪贴板（动作）= sdílení schránky
shared-folder: sdílená složka；共享文件夹（动作）= sdílet složku
sharing: Sdílení
shared-network: Sdílená síť
host-only: Pouze hostitel
bridged: Přemostění
emulated-vlan: Emulovaná VLAN
port-forwarding: přesměrování portů
lan: místní síť
shortcuts: Zkratky（aplikace Zkratky）  # https://support.apple.com/cs-cz/guide/shortcuts-mac/welcome/mac
command-line-tool: nástroj příkazového řádku
clone: klonovat
fingerprint: otisk klíče（不用 otisk prstu）
hardware-reset: hardwarový reset
mount: připojit（Linux 文件系统）
shared-library: sdílená knihovna
capture-mouse: zachytit myš；捕获鼠标按钮 = tlačítko Zachytit myš
keys: klávesa Control、klávesa Option  # https://support.apple.com/cs-cz/102650
toolbar: panel nástrojů
settings: nastavení
classic-systems: klasické systémy
rosetta: Rosetta，按 Apple 捷克语变格：Rosetty、Rosettě、Rosettu  # https://support.apple.com/cs-cz/102527
cpu: CPU（中性，例如 10jádrové CPU）；CPU Cores = Jádra CPU  # https://www.apple.com/cz/macbook-air/specs/
# 以下不在 terms.yml，在 needs_review 和补译批次中出现 3 次以上，由改稿代理定下
drive: disk（不用 jednotka）；External Drive = Externí disk，Removable Drive = Vyměnitelný disk（两者不能同词）  # https://support.apple.com/cs-cz/guide/mac-help/mchlp2304/mac（「disků」）
disk-image: obraz disku；image 单用时写 obraz（不用 obrázek、bitová kopie）  # https://support.apple.com/cs-cz/guide/disk-utility/dskutl11888/mac
display: monitor；Displays = Monitory（不用 displej）  # https://support.apple.com/cs-cz/guide/mac-help/mchl3a7ba2b7/mac（「Připojení externího monitoru」）
menu-bar: řádek nabídek（不用 panel nabídek）；Dock 原样大写，ikona v Docku  # https://support.apple.com/cs-cz/guide/mac-help/mchlp1446/mac
recovery: zotavení（Zotavení macOS；recovery mode = režim zotavení；recovery IPSW = IPSW pro zotavení），不用 obnovení  # https://support.apple.com/cs-cz/102518
restore-resume: Restore = Obnovit，Restoring = Obnovuje se；Resume = Pokračovat，Resuming = Pokračuje（两组不能同词）
pause-suspend: Pause = Pozastavit，Paused = Pozastaveno；Suspend = Uspat，Suspended = Uspáno，suspend state = stav uspání；Stop = Zastavit（三者不能同词）
vm-state: 进行中的状态用「动词 + se」，例如 Spouští se、Zastavuje se、Ukládá se；完成的状态用中性被动形容词，例如 Spuštěno、Zastaveno
boot: 名词 spouštění（Boot、UEFI Boot、Secure Boot）；形容词 spouštěcí（Boot Image = Spouštěcí obraz）；动词 spustit
delete-remove: Delete = Smazat；Remove = Odstranit（不用 odebrat）；Eject = Vysunout
vm-shortcut: zástupce（UTM 中指向别处虚拟机的快捷方式；不用 zkratka，避免和 Zkratky App 混淆）
shared-directory: sdílený adresář；Shared Folder 仍写 sdílená složka
input-capture: zachytávání vstupu；Capture Input = Zachytit vstup
serial: sériový port（Serial、Serial %lld、Serial (TTY) 统一）
keystroke: stisknutí kláves（不用 úhozy）；modifier key = modifikační klávesa
stop-method: Request = Požádat，Force = Vynutit，Kill = Ukončit proces；菜单 Force kill = Vynutit ukončení procesu
help-text: 帮助提示和快捷指令说明：带句号的写第 3 人称（Smaže…、Spustí…）；不带句号的按钮提示和标签写不定式（Klonovat…）；要求用户操作的提示写命令式（Vyberte…）
