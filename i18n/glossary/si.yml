# si 定下的译法。规则见 i18n/glossary/terms.yml。
# 来源：amalthea（VM64 官网）的 glossary/si.yml，commit b724790。去掉了官网专用的 ui-* 术语。
# Apple 没有僧伽罗语的页面（support.apple.com/si-lk 跳转到英文版），rule 是 apple 的术语查不到，按僧伽罗语软件界面（Microsoft 僧伽罗语界面）的通行说法写，并写「未查到」。
# yansaya、rakaransaya 必须在 ් 后加 U+200D：අතථ්‍ය、ප්‍රතිපත්තිය。repaya（ර්ය，例如 කාර්ය）沿用原文写法。不要删除合法的 U+200C、U+200D。
# 拉丁字母名称后接僧伽罗语词：Mac මත、Mac හි、Mac එකක
virtual-machine: අතථ්‍ය යන්ත්‍රය；复数 අතථ්‍ය යන්ත්‍ර（不用错拼 අථත්‍ය）
guest: ආගන්තුක；客户机系统 = ආගන්තුක පද්ධතිය，客户机工具 = ආගන්තුක මෙවලම්（不用 සේවාදායක、සේවාලාභී、ග්‍රාහක）
emulate: අනුකරණය කිරීම；අනුකරණය
virtualize: අතථ්‍යකරණය කිරීම；අතථ්‍යකරණය
native: ස්වදේශීය；接近原生的速度 = ස්වදේශීය වේගයට ආසන්න වේගය（不用 දේශීය、ස්වදේශය）
architecture: ආකිටෙක්චරය；复数 ආකිටෙක්චර（不用 ගෘහ නිර්මාණ ශිල්පය，那是建筑学）  # 未查到通行写法，待母语者确认
backend: බැක්එන්ඩ්；QEMU බැක්එන්ඩ්，Apple බැක්එන්ඩ්（不用 පසුබිම、පසුපෙළ）
apple-silicon: Apple silicon；Apple 芯片的 Mac = Apple silicon සහිත Mac  # 未查到，Apple 没有僧伽罗语页面，参照 Apple 印地语写法保留拉丁字母
intel-mac: Intel මත පදනම් වූ Mac  # 未查到，参照 Apple 英文 Intel-based Mac
cpu: CPU（不加英文复数 s）
rosetta: Rosetta
snapshot: ස්නැප්ෂොට්（不用 ඡායාරූපය，那是照片）
disposable-mode: ඉවතලන මාදිලිය（「机型」另用 යන්ත්‍ර，不用 මාදිලි）
shut-down: අතථ්‍ය යන්ත්‍රයේ පද්ධතිය වසා දැමීම  # 动词按 Microsoft 的 වසා දැමීම，必须带宾语「虚拟机里的系统」，否则会读成关闭窗口；不用 ක්‍රියාවිරහිත（停用）。主代理定稿，待母语者确认
new-vm-wizard: අතථ්‍ය යන්ත්‍රයක් සෑදීමේ විශාරදය
installer-image: ස්ථාපන ඉමේජ් ගොනුව（不用 රූපය，රූපය 是图片）
license: බලපත්‍රය；自备许可证 = ඔබේම බලපත්‍රයක් අවශ්‍ය වේ
secure-boot: Secure Boot  # 未查到 Microsoft 僧伽罗语写法，原译混用 ආරක්ෂිත ඇරඹුම් 和 Secure Boot，统一为拉丁字母，待母语者确认
or-later: හෝ ඊට පසු අනුවාදයක්  # 未查到，Apple 没有僧伽罗语页面
experimental: පර්යේෂණාත්මක විශේෂාංගය（不用 ලක්ෂණය）
auto-resolution: ස්වයංක්‍රීය විභේදන සීරුමාරුව
shared-clipboard: බෙදාගත් පසුරු පුවරුව；共享剪贴板（动作）= පසුරු පුවරුව බෙදාගැනීම（不用音译 ක්ලිප්බෝඩ්）  # 未查到 Apple 写法，「剪贴板」用 Microsoft 僧伽罗语写法
shared-folder: බෙදාගත් ෆෝල්ඩරය；共享文件夹（动作）= ෆෝල්ඩර බෙදාගැනීම
sharing: බෙදාගැනීම
shared-network: බෙදාගත් ජාලය
host-only: සත්කාරකය පමණි
bridged: පාලම් කළ
emulated-vlan: අනුකරණය කළ VLAN
port-forwarding: තොට ඉදිරියට යැවීම
lan: ස්ථානීය ජාලය（不用英文缩写 LAN）
shortcuts: Shortcuts යෙදුම（不用 කෙටිමං，那是键盘快捷键）  # 未查到，iOS 没有僧伽罗语界面，保留英文 App 名，待母语者确认
command-line-tool: විධාන රේඛා මෙවලම
clone: ක්ලෝන කිරීම
fingerprint: ෆිංගර්ප්‍රින්ට්（不用 ඇඟිලි සලකුණ，那是手指的指纹）  # 待母语者确认
hardware-reset: දෘඪාංග යළි පිහිටුවීම
mount: සවි කිරීම
shared-library: හවුල් පුස්තකාලය（不用 බෙදාගත්，避免和「共享」功能混淆）
capture-mouse: මූසිකය ග්‍රහණය කිරීම；捕获鼠标按钮 = මූසිකය ග්‍රහණය කිරීමේ බොත්තම
keys: Control යතුර、Option යතුර  # 未查到 Apple 僧伽罗语写法，保留键帽上的英文
toolbar: මෙවලම් තීරුව  # 未查到 Apple 写法，用 Microsoft 僧伽罗语写法
settings: සැකසීම්（不用 සැකසුම්）  # 未查到 Apple 写法
classic-systems: සම්භාව්‍ය පද්ධති

# 以下是 terms.yml 没有、在界面文案中出现 3 次以上的术语（2026-11-05 审校时定）
drive: ධාවකය；复数 ධාවක
driver: ඩ්‍රයිවර（不用 ධාවක，避免和 drive 同词）
image: ඉමේජ් ගොනුව；磁盘映像 = තැටි ඉමේජ් ගොනුව（不用 රූපය、පින්තූර，那是图片）
display: සංදර්ශකය；复数 සංදර්ශක
directory: නාමාවලිය；共享目录 = බෙදාගත් නාමාවලිය（不用 හවුල්）
host: සත්කාරකය（和 host-only 一致，不用 ධාරකය）
storage: ආචයනය（不用 ගබඩාව；动词「存放」可以写 ගබඩා කරන්න）
mode: මාදිලිය（不用 ප්‍රකාරය）
core: හරය；复数 හර
boot: ඇරඹුම；动词 අරඹන්න
kernel: කර්නලය；复合词写 කර්නල（不用 කර්නල්）
terminal: පර්යන්තය（不用音译 ටර්මිනලය）
built-in: අන්තර්ගත（不用音译 බිල්ට්）
optional: වෛකල්පිත（不用 විකල්ප，那是「选项」）
checked: සලකුණු කළ（复选框选中；不用 පරීක්ෂා කළ，那是「检查」）
quit: පිටවන්න；名词 පිටවීම（和 Close 的 වසන්න、Remove 的 ඉවත් කරන්න 区分）
power-down: බලය නිවා දැමීම
kill: අවසන් කිරීම；强制结束 = බලහත්කාරයෙන් අවසන් කරන්න（不用 මරා දමන්න、විනාශ කරන්න）
restart: යළි ආරම්භ කරන්න
resume: දිගටම ධාවනය කරන්න（和 restart 区分，不用 නැවත ආරම්භ කරන්න）
restore: ප්‍රතිෂ්ඨාපනය කරන්න（从快照恢复；和 recovery 区分）
recovery: ප්‍රතිසාධනය；恢复模式 = ප්‍රතිසාධන මාදිලිය
