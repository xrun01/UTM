# is 定下的译法。键是 i18n/glossary/terms.yml 的术语 id。
# 来源：amalthea（VM64 官网）的 glossary/is.yml，commit b724790。去掉了官网专用的 ui-* 术语。
# Apple 没有冰岛语界面：support.apple.com/is-is 只有页脚是冰岛语，正文是英文。rule 是 apple 的术语参照 Apple 英文写法的结构，用冰岛语通行说法（待母语者确认）。
virtual-machine: sýndarvél；复数 sýndarvélar；QEMU-sýndarvél、macOS-sýndarvél
guest: gestur；客户机系统 = gestastýrikerfi；客户机工具 = gestaverkfæri（不用 biðlari、viðskiptavinur）
emulate: herma eftir；hermun；QEMU 模拟 = QEMU-hermun
virtualize: sýndarvæða；sýndarvæðing
native: 接近原生的速度 = nánast fullur hraði（不用 innfæddur）
architecture: arkitektúr；复数 arkitektúrar；CPU 架构 = örgjörvaarkitektúr
backend: bakendi；QEMU-bakendi、Apple-bakendi
apple-silicon: Apple-örgjörvi；Apple 芯片的 Mac = Mac með Apple-örgjörva，复数 Mac-tölvur með Apple-örgjörva  # 参照 https://support.apple.com/en-us/116943 的结构，冰岛语页面正文是英文
intel-mac: Mac með Intel-örgjörva；复数 Mac-tölvur með Intel-örgjörva  # 参照 https://support.apple.com/en-us/116943
cpu: örgjörvi；CPU 核心 = örgjörvakjarni
snapshot: skyndimynd；复数 skyndimyndir
disposable-mode: einnota stilling
shut-down: slökkva á；关机后 = eftir að slökkt er á þeim
new-vm-wizard: leiðsögn fyrir nýjar sýndarvélar
installer-image: uppsetningardiskmynd（不用 uppsetningarmynd，会读成图片）
license: leyfi；自备许可证 = eigið leyfi
secure-boot: Secure Boot  # support.microsoft.com/is-is 的页面是英文，没查到 Windows 冰岛语界面写法，暂保留原名（待母语者确认）
or-later: eða nýrri  # 参照 https://support.apple.com/en-us/102552（「or later」）
experimental: tilraunaeiginleiki
auto-resolution: sjálfvirk aðlögun upplausnar
shared-clipboard: samnýtt klippiborð；共享剪贴板（动作）= samnýta klippiborðið；复制 = afrita；粘贴 = líma（不用 klemmuspjald）
shared-folder: samnýtt mappa；共享文件夹（动作）= samnýta möppur（不用 deila）
sharing: Samnýting
shared-network: Samnýtt net
host-only: Aðeins hýsill
bridged: Brúað
emulated-vlan: Hermt VLAN
port-forwarding: framsending gátta（不用 hafnir）
lan: staðarnet
shortcuts: Shortcuts  # macOS 没有冰岛语界面，App 名显示英文：https://support.apple.com/en-us/guide/shortcuts-mac/welcome/mac
command-line-tool: skipanalínutól
clone: klóna
fingerprint: fingrafar
hardware-reset: endurstilling vélbúnaðar
mount: tengja inn
shared-library: samnýtt forritasafn；复数 samnýtt forritasöfn（不用 bókasafn）
capture-mouse: fanga músina；捕获鼠标按钮 = hnappurinn Fanga mús
keys: Control-lykill、Option-lykill；同时写 2 个键 = Control- og Option-lyklarnir  # Mac 键盘印 control、option，Apple 没有冰岛语写法
toolbar: tækjastika
settings: stillingar
classic-systems: klassísk kerfi
# 以下是审校 UI 文案时新定的界面术语（terms.yml 没有）。冰岛语没有 Apple 界面，按冰岛语软件界面的通行说法
ui-style: 按钮、菜单项、开关、快捷指令动作名和动作说明用不定式（Ræsa、Eyða、Bæta við），不用命令式；状态标签用第 3 人称现在时（Ræsir、Stöðvar）
drive: drif（复数 drif）；Removable Drive = Laust drif；External Drive = Ytra drif（不用 diskur）
disk-image: diskmynd；drive image、image 都译 diskmynd，例如 ISO-diskmynd、ræsidiskmynd（单独的 mynd 读成图片）
kernel-image: kjarnaskrá（不用 kjarnamynd）
ramdisk: RAM-diskur；initial ramdisk = upphafs-RAM-diskur
configuration: grunnstilling；configuration file = grunnstillingaskrá（stillingar 留给 settings，uppsetning 留给 installation）
host: hýsill；host machine = hýsilvél（不用 gestgjafi、hýsingarvél）
state: ástand（虚拟机状态）；status = staða；suspended state = biðstaða
mode: stilling；recovery mode = endurheimtarstilling；full screen mode = fullskjásstilling（和 disposable-mode 一致）
vm-power: Start = Ræsa；Stop = Stöðva；Pause = Gera hlé；Suspend = Setja í biðstöðu；Resume = Halda áfram；Restart = Endurræsa；Reset = Endurstilla；power down = lokun
stop-method: Kill = Stöðvun ferlis；Request = Lokunarbeiðni；Force = Þvinguð lokun
recovery-ipsw: IPSW-endurheimtarskrá；IPSW recovery image = IPSW-endurheimtardiskmynd
directory: mappa（和 shared-folder 一致，不用 skrá）
read-only: skrifvarið
display: skjár；复数 skjáir
download: hlaða niður；名词 niðurhal（不用 sækja，它用于 get）
eject: Spýta út（和 Eyða、Afþjappar 区分）
delete-remove: Delete = Eyða；Remove = Fjarlægja
gallery-library: Gallery = gallerí（UTM-gallerí、Sýndarvélagallerí）；UTM Library = UTM-safn
guest-agent: gestaumboðsforrit（不用 gestaþjónn，þjónn 是服务器；不用 umboðsmaður，是代理人）
console: útstöð（UTM 的 console 是文本终端窗口，和 terminal 同词；不用 stjórnborð，冰岛语界面里是控制面板）；terminal = útstöð
dock: Dock（macOS 功能名，不用 bryggja）
capture-input: fanga inntak；名词 föngun inntaks
