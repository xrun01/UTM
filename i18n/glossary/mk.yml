# mk 定下的译法。键是 i18n/glossary/terms.yml 的术语 id。正文用西里尔字母，专有名词保留拉丁字母（Mac、macOS、Rosetta），不变格。
# 来源：amalthea（VM64 官网）的 glossary/mk.yml，commit b724790。去掉了官网专用的 ui-* 术语。
# Apple 没有马其顿语的支持页和 macOS 界面（support.apple.com/mk-mk 显示英文），rule 是 apple 的术语按马其顿语通行说法写，待母语者确认。
virtual-machine: виртуелна машина；「Windows 虚拟机」= виртуелна машина со Windows（不写 виртуелна машина Windows、macOS виртуелна машина）
guest: гостински；客户机系统 = гостински систем；客户机工具 = алатки за гостинскиот систем（不用 клиентски）
emulate: емулира；емулација（不用 имитира、симулира）
virtualize: виртуелизира；виртуелизација
native: нативен；接近原生的速度 = речиси нативна брзина（不用 мајчин、матичен、природен）
architecture: архитектура
cpu: процесор；CPU 架构 = архитектура на процесорот
backend: бекенд；бекендот QEMU、бекендот Apple（不用 заднина、заден дел）
apple-silicon: чип Apple；Apple 芯片的 Mac = Mac со чип Apple  # 没有 Apple 马其顿语页面，待母语者确认
intel-mac: Mac со процесор Intel  # 没有 Apple 马其顿语页面，待母语者确认
rosetta: Rosetta（不变格）
snapshot: снимка（不用 слика）；快照标签页 = картичката Снимки（标签页用 картичка，不用 табулатор：它会读成制表符或 Tab 键）
disposable-mode: режим за еднократна употреба
shut-down: исклучи；исклучување
new-vm-wizard: волшебник за нови виртуелни машини
installer-image: слика за инсталација
license: лиценца；自备许可证 = сопствена лиценца
secure-boot: Secure Boot  # support.microsoft.com/mk-mk 显示英文，查不到 Windows 马其顿语界面的译法，待母语者确认
or-later: или понова верзија（不写 или повисок）  # 没有 Apple 马其顿语页面，待母语者确认
experimental: експериментална функција（不用 карактеристика）
auto-resolution: автоматско прилагодување на резолуцијата
shared-clipboard: споделена табла со исечоци；共享剪贴板（动作）= споделување на таблата со исечоци；粘贴 = залепи
shared-folder: споделена папка
sharing: споделување
shared-network: Споделена мрежа
host-only: Само домаќин
bridged: Премостена мрежа
emulated-vlan: Емулиран VLAN
port-forwarding: пренасочување на порти
lan: локална мрежа
shortcuts: Shortcuts（апликацијата Shortcuts）  # macOS 没有马其顿语界面，App 名显示英文，待确认
command-line-tool: алатка за командна линија
clone: клонира
fingerprint: отпечаток（不写 отпечаток од прст）
hardware-reset: хардверско ресетирање
mount: монтира
shared-library: споделена библиотека
capture-mouse: фати го глувчето；捕获鼠标按钮 = копчето „Фати го глувчето“
keys: копчето Control、копчето Option（不译成 контрола、опции）  # 没有 Apple 马其顿语页面，待母语者确认
toolbar: лента со алатки
settings: поставки
classic-systems: класични системи
# 以下是 needs_review 和缺译审校时定下的界面术语（terms.yml 没有，待主代理决定是否补进 terms.yml）。
# 写法：按钮、菜单项、开关、工具提示用第 2 人称单数命令式（Додај、Избриши、Стартувај）；要求用户操作的提示句用敬称复数（Изберете）。
drive: диск（不用 уред、погон）；驱动器镜像 = слика на диск；外部驱动器 = надворешен диск；可移动驱动器 = пренослив диск
display: екран；displays = екрани
shortcut: кратенка（指向虚拟机的快捷方式）；键盘快捷键 = кратенки на тастатурата
host: домаќин；主机的网络 = мрежи на домаќинот（和 host-only 一致）
kernel: кернел（不用 јадро：јадро 是 CPU 核心）
boot: подигање；启动镜像 = слика за подигање
recovery: обновување；恢复模式 = режим за обновување（快照恢复用 врати，和它区分）
storage: складиште（和内存 меморија 区分）
input: внес；捕获输入 = фати го внесот（音频输入输出用 влез/излез）
scan-code: скен-код
start-vm: стартувај（Start 和 Run 都是启动虚拟机）；状态 Starting = се стартува、Started = стартувано
stop-vm: запри；Pause = паузирај；Suspend = суспендирај；Resume = продолжи；Restore = врати
eject: исфрли（和 Delete = избриши、Remove = отстрани 区分）
quit: излези；退出 = излегување（不用 откажи：它是 Cancel）
default: стандардно（和 Generic = генерички 区分）
edit: измени（不用 уреди：它和 Devices = уреди 同形）
power: напојување
dock: Dock（不译成 пристаниште、приклучок）
