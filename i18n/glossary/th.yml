# th 定下的译法。规则见 i18n/glossary/terms.yml。泰语书写不用空格，U+200B 是合法的词边界标记，不要删除。
# 来源：amalthea（VM64 官网）的 glossary/th.yml，commit b724790。去掉了官网专用的 ui-* 术语。
virtual-machine: เครื่องเสมือน
guest: เกสต์；客户机系统 = ระบบเกสต์；客户机工具 = เครื่องมือเกสต์（不用 ไคลเอนต์、แขก）
emulate: อีมูเลต；名词 การอีมูเลชัน（音译。不用 จำลอง，它和虚拟化 การจำลองเสมือน 同根；泰语技术语境常说 อีมูเลเตอร์，读者能认出）  # 主代理定稿
virtualize: การจำลองเสมือน（Windows 泰语界面的写法）  # https://support.microsoft.com/th-th/windows/enable-virtualization-on-windows-c5578302-6e43-4b4b-a449-8ced115f58e1
native: เนทีฟ；接近原生的速度 = ความเร็วใกล้เคียงเนทีฟ
architecture: สถาปัตยกรรม
backend: แบ็กเอนด์；แบ็กเอนด์ QEMU、แบ็กเอนด์ของ Apple
apple-silicon: Apple Silicon；Apple 芯片的 Mac = Mac ที่มี Apple Silicon  # https://support.apple.com/th-th/116943
intel-mac: Mac ที่ใช้โปรเซสเซอร์ Intel  # https://support.apple.com/th-th/116943
cpu: CPU  # Apple 泰语页面保留 CPU
rosetta: Rosetta  # https://support.apple.com/th-th/102527
snapshot: สแนปช็อต
disposable-mode: โหมดใช้ครั้งเดียว
shut-down: ปิดเครื่อง
new-vm-wizard: ตัวช่วยสร้างเครื่องเสมือนใหม่
installer-image: อิมเมจการติดตั้ง
license: สิทธิ์การใช้งาน  # https://support.microsoft.com/th-th/windows/activate-windows-c39005d4-95ee-b91e-b399-2820fda32227
secure-boot: การบูตแบบปลอดภัย  # https://support.microsoft.com/th-th/windows/windows-11-and-secure-boot-a8ff1202-c0d9-42f5-940f-843abef64fad
or-later: หรือใหม่กว่า  # https://www.apple.com/th/logic-pro/specs/（「macOS 15.6 หรือใหม่กว่า」）
experimental: คุณสมบัติทดลอง
auto-resolution: การปรับความละเอียดอัตโนมัติ
shared-clipboard: คลิปบอร์ด；共享剪贴板 = การแชร์คลิปบอร์ด；复制粘贴 = คัดลอกและวาง  # https://support.apple.com/th-th/102430
shared-folder: โฟลเดอร์ที่แชร์；共享文件夹 = แชร์โฟลเดอร์
sharing: การแชร์（不用 แบ่งปัน）
shared-network: เครือข่ายที่ใช้ร่วมกัน
host-only: โฮสต์เท่านั้น
bridged: บริดจ์
emulated-vlan: VLAN แบบอีมูเลต
port-forwarding: การส่งต่อพอร์ต
lan: เครือข่ายในพื้นที่  # https://support.apple.com/th-th/102229
shortcuts: แอปคำสั่งลัด  # https://support.apple.com/th-th/guide/shortcuts-mac/welcome/mac
command-line-tool: เครื่องมือบรรทัดคำสั่ง
clone: โคลน
fingerprint: ฟิงเกอร์ปรินต์（不用 ลายนิ้วมือ，它是手指指纹）
hardware-reset: รีเซ็ตฮาร์ดแวร์
mount: เมานต์（不用 ติดตั้ง，它是安装）
shared-library: ไลบรารีที่ใช้ร่วมกัน
capture-mouse: จับเมาส์；捕获鼠标按钮 = ปุ่มจับเมาส์
keys: ปุ่ม Control、ปุ่ม Option  # https://support.apple.com/th-th/102650
toolbar: แถบเครื่องมือ  # https://support.apple.com/th-th/guide/mac-help/mchlp1225/mac
settings: การตั้งค่า
classic-systems: ระบบคลาสสิก
# 以下是审校界面文案时新定的术语（待审条目中出现 3 次以上）
drive: ไดรฟ์；外部驱动器 = ไดรฟ์ภายนอก；可移动驱动器 = ไดรฟ์แบบถอดได้
image: อิมเมจ；磁盘映像 = ดิสก์อิมเมจ；驱动器映像 = อิมเมจไดรฟ์；启动映像 = อิมเมจสำหรับบูต（不用 ภาพ、รูปภาพ，它们是图片）
directory: ไดเรกทอรี；共享目录 = ไดเรกทอรีที่แชร์（不用 ไดเร็กทอรี、ใช้ร่วมกัน）
memory-storage: 内存 = หน่วยความจำ；存储空间 = พื้นที่จัดเก็บข้อมูล
optional: (ไม่บังคับ)；必需 = (จำเป็น)（不用 เป็นทางเลือก、ไม่จำเป็น）
delete-remove-eject: 删除 = ลบ；移除 = เอาออก；推出 = นำออก；解压 = แตกไฟล์
vm-states: 启动 = เริ่ม；运行 = เรียกใช้；停止 = หยุด；暂停 = หยุดชั่วคราว；挂起 = ระงับ；继续运行 = ทำงานต่อ；恢复快照 = กู้คืน；重启 = รีสตาร์ท；状态标签用「กำลัง…」和「…แล้ว」
stop-method: Request = ร้องขอ；Force = บังคับ；Kill = บังคับยุติ（不用 ฆ่า）
capture-input: จับอินพุต（不用 บันทึก、จับภาพ）
modifier-keys: ปุ่มปรับแต่ง  # 未查到 Apple 泰语页面核对
dock: Dock（保留原文，不用 ท่าเรือ）；Dock 图标 = ไอคอนใน Dock
app: แอป（不用 แอพ）
question: 对话框问句用 หรือไม่ 结尾，不用 ไหม，不加问号
