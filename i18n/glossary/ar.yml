# ar 定下的译法。规则见 i18n/glossary/terms.yml。
virtual-machine: آلة افتراضية؛ الآلة الافتراضية؛ الجمع الآلات الافتراضية  # app 已审校译文统一用 افتراضي（translated 中 69 条），与官网（Microsoft 写法 جهاز ظاهري）不同
guest: الضيف؛ نظام الضيف، أدوات الضيف
emulate: يحاكي؛ المحاكاة
virtualize: الافتراضية（Virtualization = الافتراضية、Use Virtualization = استخدام الافتراضية）  # app 已审校译文统一用 افتراضي，与官网（Microsoft 写法 الظاهرية）不同；不用 المحاكاة الافتراضية，因为 المحاكاة 是 emulate 的译法
native: السرعة الأصلية
architecture: بنية؛ الجمع بنيات
backend: الواجهة الخلفية؛ واجهة QEMU الخلفية، واجهة Apple الخلفية
apple-silicon: Apple silicon؛ جهاز Mac مزود بشريحة Apple silicon  # https://support.apple.com/ar-ae/116943
intel-mac: جهاز Mac مزود بمعالج Intel  # https://support.apple.com/ar-ae/116943
snapshot: لقطة؛ الجمع لقطات
disposable-mode: وضع الاستخدام لمرة واحدة
shut-down: إيقاف التشغيل
new-vm-wizard: معالج إنشاء الآلات الافتراضية  # app 已审校译文统一用 افتراضي，与官网（Microsoft 写法 الأجهزة الظاهرية）不同
installer-image: صورة التثبيت
license: ترخيص
secure-boot: التمهيد الآمن  # https://support.microsoft.com/ar-sa/windows/windows-11-and-secure-boot-a8ff1202-c0d9-42f5-940f-843abef64fad
experimental: ميزة تجريبية
auto-resolution: ضبط الدقة تلقائيًا
shared-clipboard: الحافظة المشتركة؛ مشاركة الحافظة
shared-folder: المجلد المشترك
sharing: المشاركة
shared-network: الشبكة المشتركة
host-only: المضيف فقط
bridged: الجسر
emulated-vlan: شبكة VLAN المحاكاة
port-forwarding: إعادة توجيه المنافذ
lan: الشبكة المحلية
shortcuts: تطبيق الاختصارات  # https://support.apple.com/ar-ae/guide/shortcuts-mac/welcome/mac
command-line-tool: أداة سطر الأوامر
clone: استنساخ
fingerprint: البصمة الرقمية
hardware-reset: إعادة ضبط العتاد
mount: ركّب (mount)  # 只写 ركّب 会和安装 ثبّت 混淆，ضمّ 读者看不懂；主代理定稿，待母语者确认
shared-library: مكتبة مشتركة؛ الجمع مكتبات مشتركة
capture-mouse: التقاط الماوس؛ زر التقاط الماوس
keys: مفتاح Control، مفتاح Option  # https://support.apple.com/ar-ae/102650
toolbar: شريط الأدوات
settings: الإعدادات
or-later: أو إصدار أحدث؛作宾语时用宾格 أو إصدارًا أحدث
classic-systems: الأنظمة الكلاسيكية

# 不在 terms.yml 中、缺译批次中出现 3 次以上的界面术语
drive: قرص؛ الجمع أقراص（Drives = الأقراص、Drive Image = صورة قرص、Disks Only = الأقراص فقط）  # 目录已有 Drives = الأقراص
image: صورة（Drive Image = صورة قرص、Floppy Image = صورة قرص مرن、ISO 镜像 = صورة ISO）；不是图片
display: شاشة عرض؛ الجمع شاشات العرض（窗口菜单和工具栏的 Displays）  # macOS 系统设置（ar）DisplaysExt：Displays = شاشات العرض
key: مفتاح؛ الجمع مفاتيح（Send Key = إرسال مفتاح、Modifier Key = مفتاح التعديل、keystrokes = ضغطات المفاتيح）；键名保留拉丁字母  # https://support.apple.com/ar-ae/102650
device: جهاز؛ الجمع أجهزة（USB Devices = أجهزة USB、Boot Device = جهاز التمهيد）
power: الطاقة（显示窗口工具栏和菜单的 Power）  # macOS 本地化资源（ar）：Power = الطاقة
