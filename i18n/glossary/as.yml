# as 定下的译法。规则见 i18n/glossary/terms.yml。
# 来源：amalthea（VM64 官网）的 glossary/as.yml，commit b724790。去掉了官网专用的 ui-* 术语。
# Apple 和 Microsoft 都没有阿萨姆语支持页（support.apple.com/as-in 返回 404，support.microsoft.com/as-in 跳转到 en-us）。rule 是 apple、microsoft 的术语按阿萨姆语软件界面的通行说法定，待母语者确认。
# as 只修语义错误、术语错误、漏译、文字系统错误，不修不通顺。数字用阿拉伯数字，不用 ০-৯。
virtual-machine: ভাৰ্চুৱেল মেচিন（不用 ভাৰ্চুৱেল যন্ত্ৰ）
guest: অতিথি；客户机系统 = অতিথি চিস্টেম，客户机工具 = অতিথি সঁজুলি（不用 ক্লাএন্ট）
emulate: ইমুলেট কৰা；ইমুলেচন（不用 অনুকৰণ、চিমুলেচন）
virtualize: ভাৰ্চুৱেলাইজ কৰা；ভাৰ্চুৱেলাইজেচন
native: নেটিভ；接近原生的速度 = প্ৰায় নেটিভ গতি（不用 স্থানীয়，它是本地）
architecture: আৰ্কিটেকচাৰ（不用 স্থাপত্য，它是建筑）
backend: বেকএণ্ড；QEMU বেকএণ্ড，Apple বেকএণ্ড
apple-silicon: Apple চিপ；Apple 芯片的 Mac = Apple চিপ থকা Mac  # 无 Apple 阿萨姆语来源
intel-mac: Intel Mac；不加英文复数 s，复数写 Intel Mac সমূহ  # 无 Apple 阿萨姆语来源
cpu: CPU（不音译）
rosetta: Rosetta；词尾直接连写，例如 Rosettaও
snapshot: স্নেপশ্বট
disposable-mode: এবাৰীয়া মোড；Disposable = এবাৰীয়া（一次性，不保存更改；不用音译 থ্ৰ'ৱে）  # 待母语者确认
shut-down: বন্ধ কৰা；关机后 = বন্ধ কৰাৰ পিছত
new-vm-wizard: ভাৰ্চুৱেল মেচিন সৃষ্টিৰ উইজাৰ্ড（不写 নতুন উইজাৰ্ড）
installer-image: ইনষ্টলেচন ইমেজ（不用 ছবি、প্ৰতিমুৰ্তি）
license: অনুজ্ঞাপত্ৰ；自备许可证 = নিজৰ অনুজ্ঞাপত্ৰৰ প্ৰয়োজন
secure-boot: সুৰক্ষিত বুট  # 无 Microsoft 阿萨姆语来源，沿用原译，待母语者确认
or-later: বা তাৰ পিছৰ সংস্কৰণ  # 无 Apple 阿萨姆语来源
experimental: পৰীক্ষামূলক বৈশিষ্ট্য
auto-resolution: স্বয়ংক্ৰিয় ৰিজ'লিউচন সামঞ্জস্য
shared-clipboard: অংশীদাৰী ক্লিপবৰ্ড；共享剪贴板（动作）= ক্লিপবৰ্ড অংশীদাৰী কৰা
shared-folder: অংশীদাৰী ফোল্ডাৰ；共享文件夹（动作）= ফোল্ডাৰ অংশীদাৰী কৰা
sharing: অংশীদাৰী（不用 শ্বেয়াৰ、শ্বেয়াৰিং）
shared-network: অংশীদাৰী নেটৱৰ্ক
host-only: কেৱল হস্ট
bridged: ব্ৰীজ কৰা
emulated-vlan: ইমুলেটেড VLAN
port-forwarding: পৰ্ট ফৰৱাৰ্ডিং
lan: স্থানীয় নেটৱৰ্ক（不写 LAN）
shortcuts: চৰ্টকাট এপ；加 এপ，和键盘快捷键区分  # 无 Apple 阿萨姆语来源
command-line-tool: আদেশ-শাৰী সঁজুলি
clone: ক্ল'ন কৰা
fingerprint: আঙুলিৰ ছাপ
hardware-reset: হাৰ্ডৱেৰ ৰিছেট
mount: মাউন্ট কৰা
shared-library: অংশীদাৰী লাইব্ৰেৰী
capture-mouse: মাউছ ধৰা；捕获鼠标按钮 = মাউছ ধৰা বুটাম
keys: Control কি'、Option কি'（键名按键帽写，不意译）
toolbar: সঁজুলিদণ্ডি
settings: সংহতি（不用 ছেটিংছ）
classic-systems: ক্লাছিক চিস্টেম

# 以下由 2026-11-05 审校新定：待审条目中出现 3 次以上、terms.yml 没有的界面术语。旧译有 2 种写法时，取多数或不会混淆的写法。
file: ফাইল（不用 নথিপত্ৰ）
directory: ডাইৰেক্টৰী；共享目录 = অংশীদাৰী ডাইৰেক্টৰী（不用 পঞ্জিকা，它也指历书）
install: ইনষ্টল কৰা；名词 ইনষ্টলেচন（不用 সংস্থাপন，它也用来译 set up）；set up = ছেট আপ কৰা
enable: সামৰ্থবান কৰা；Disabled = অসামৰ্থবান（不用 সক্ষম、নিষ্ক্ৰিয়，নিষ্ক্ৰিয় 留给 Inactive）
operating-system: অপাৰেটিং চিস্টেম；system = চিস্টেম（不用 কাৰ্য্যকৰপ্ৰণালী、ব্যৱস্থাপ্ৰণালী）
image: ইমেজ；ডিষ্ক ইমেজ、ড্ৰাইভ ইমেজ、বুট ইমেজ（不用 ছবি、প্ৰতিমুৰ্তি）；format = ফৰ্মেট
disk: ডিষ্ক
host: হস্ট；主机 = হস্ট মেচিন（不用 হ'ষ্ট、গৃহস্থ যন্ত্ৰ）
machine: মেচিন；your machine = আপোনাৰ মেচিন（不用 যন্ত্ৰ）
window: উইন্ডো
recovery: ৰিকভাৰী；恢复模式 = ৰিকভাৰী মোড（পুনৰুদ্ধাৰ 留给 Restore，从快照恢复）
mode: মোড（不用 ধৰণ、অৱস্থা）
data: তথ্য（不用 ডাটা）
error: ত্ৰুটি（不用 ভুল）
storage: ষ্ট'ৰেজ（和 Memory মেমৰি 区分；不用 সংৰক্ষণ，它是「保存」）
interface: ইণ্টাৰফেচ（网卡、磁盘接口；不用 আন্তঃপৃষ্ঠ）
configuration: বিন্যাস（不用 সংৰূপ）
default: ডিফল্ট（不用 অবিকল্পিত；和 Generic সাধাৰণ 区分）
existing: বিদ্যমান（不用 বৰ্তমানৰ，它是「当前的」）
power-down: পাৱাৰ বন্ধ；请求关机 = পাৱাৰ বন্ধৰ অনুৰোধ（不用 পাৱাৰ ডাউন、শক্তি বন্ধ）
vm-actions: Start = আৰম্ভ কৰা；Restart = পুনৰাৰম্ভ কৰা；Resume = পুনৰ চলোৱা；Pause = বিৰতি দিয়া；Suspend = স্থগিত কৰা（不用 নিলম্বিত）；Stop = বন্ধ কৰা
vm-states: 进行态 = …কৰি থকা হৈছে（আৰম্ভ কৰি থকা হৈছে）；完成态 = …কৰা হৈছে（বন্ধ কৰা হৈছে）
kill: বলপূৰ্বক সমাপ্ত কৰা（结束 VM 进程；不用 হত্যা）
status: স্থিতি（和 state অৱস্থা 区分）
delete: মচি পেলোৱা；Remove = আঁতৰোৱা；Eject = উলিওৱা；Clear = পৰিষ্কাৰ কৰা
select: নিৰ্বাচন কৰা（不写旧拼法 নিৰ্ব্বাচন）；Choose = বাছনি কৰা
send: পঠোৱা；按钮 পঠাওক（不用 প্ৰেৰণ কৰা）
keyboard: কীবোৰ্ড；keystroke = কি'ষ্ট্ৰ'ক；modifier key = মডিফায়াৰ কি'
display: ডিছপ্লে
built-in: বিল্ট-ইন（不用 অন্তৰ্নিৰ্মিত）
download: ডাউনলোড
operation: কাৰ্য্য（不用 অপাৰেচন）
quit: প্ৰস্থান কৰা
VM: 英文写 VM 时保留 VM，不音译成 ভিএম，不加英文复数 s
punctuation: 句号「।」紧贴前一个词，前面不加空格；撇号用 '（U+0027），不用 ’
