# cy 定下的译法。键是 i18n/glossary/terms.yml 的术语 id。称呼统一用 chi（命令式 -wch），标题和按钮用动名词。
# 来源：amalthea（VM64 官网）的 glossary/cy.yml，commit b724790。去掉了官网专用的 ui-* 术语。
# Apple 和 Microsoft 都没有威尔士语页面（support.apple.com/cy-gb、support.microsoft.com/cy-gb 都跳转到英文），rule 是 apple、microsoft 的术语参照 de、it 的结构，或用威尔士语软件的通行说法。
# 「共享的 X」写成 X a rennir。界面名（网络模式名、按钮名）不做辅音音变。
