architecture: pensaernïaeth；复数 pensaernïaethau
backend: backend；backend Apple
apple-silicon: sglodyn Apple；复数 sglodion Apple；Apple 芯片的 Mac = Mac gyda sglodyn Apple（照 de、it 的 Apple 结构）
intel-mac: Mac gyda phrosesydd Intel（照 de、it 的 Apple 结构）
snapshot: ciplun；复数 cipluniau
disposable-mode: modd tafladwy
shut-down: cau i lawr
new-vm-wizard: y dewin ar gyfer peiriannau rhithwir newydd
