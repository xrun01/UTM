# eu 定下的译法。键是 i18n/glossary/terms.yml 的术语 id。
# 来源：amalthea（VM64 官网）的 glossary/eu.yml，commit b724790。去掉了官网专用的 ui-* 术语。
# Apple 没有巴斯克语页面。rule 是 apple 的术语参照 Apple es-ES 的写法结构，改用巴斯克语说法，见 proposal.json 的 doubts。
# 称呼：zu。专名和 VM64 加格尾时用连字符：Mac-ean（位格单数）、Mac-eko、Mac-ak（作格单数）、Mac-ek（作格复数）、Mac-etan、VM64-k、Windows-erako、UTM-k、UTM-ren、UTM-ra、Apple-tik。
# 格尾不直接加在占位符上（名称结尾不确定），改加在后面的名词上，例如 '%@' makina birtualera。
# 界面标题不逐词大写，只有首字母大写。数词后的名词不加冠词：%lld nukleo、%lld makina birtual。
# 标题：卡片标题、步骤标题、CTA 用动词原形（Exekutatu、Sortu、Deskargatu）。
virtual-machine: makina birtuala（不用缩写 VM，英文的 VM 也译作 makina birtuala）
guest: gonbidatua；客户机系统 = sistema gonbidatua；客户机工具 = gonbidatuaren tresnak（不用 bezero）
emulate: emulatu；emulazioa（不用 simulatu、imitatu）
virtualize: birtualizatu；birtualizazioa
native: natiboa；接近原生的速度 = abiadura ia natiboa（不用 jatorrizko）
architecture: arkitektura；CPU 架构 = PUZ arkitektura
backend: backend（不加连字符变格：backenda、backendarekin）；QEMU 后端 = QEMU backenda，Apple 后端 = Apple backenda
apple-silicon: Apple txipa；Apple 芯片的 Mac = Apple txipa duen Mac（复数 Apple txipa duten Mac-ak；不用 Apple silizioa）  # 参照 es-ES：https://support.apple.com/es-es/116943
intel-mac: Intel prozesadorea duen Mac（复数 Intel prozesadorea duten Mac-ak）  # 参照 es-ES：https://support.apple.com/es-es/116943
snapshot: bat-bateko argazkia（不单用 argazkia）  # GNOME Boxes eu 写 bat-batekoa，见 doubts
disposable-mode: erabili eta botatzeko modua
shut-down: itzali；itzaltzean
new-vm-wizard: makina birtualak sortzeko morroia
installer-image: instalazio-irudia
license: lizentzia；自备许可证 = lizentzia propioa behar duzu
secure-boot: Secure Boot  # support.microsoft.com/eu-es 回落到西班牙语页面，没有查到 Windows eu 界面写法，见 doubts
or-later: edo berriagoa
experimental: eginbide esperimentala
auto-resolution: bereizmenaren doikuntza automatikoa
shared-clipboard: arbel partekatua；共享剪贴板 = arbela partekatu
shared-folder: karpeta partekatua
sharing: Partekatzea
shared-network: Sare partekatua
host-only: Ostalaria soilik
bridged: Zubia
emulated-vlan: VLAN emulatua
port-forwarding: atakak birbideratzea（不用 portu，portu 是港口）
lan: sare lokala（不用 LAN）
shortcuts: Lasterbideak  # Apple 没有 eu 页面，参照 es-ES 的 App 名 Atajos，见 doubts
command-line-tool: komando-lerroko tresna
clone: klonatu
fingerprint: hatz-marka
hardware-reset: hardwarea berrezartzea
mount: muntatu
shared-library: liburutegi partekatua
capture-mouse: sagua harrapatu；捕获鼠标按钮 = Harrapatu sagua botoia
keys: Control tekla、Option tekla（按 Mac 键帽上的字，不用 Kontrol、Aukera）  # 见 doubts
toolbar: tresna-barra
settings: ezarpenak
rosetta: Rosetta
cpu: PUZ
classic-systems: sistema klasikoak
# 以下是 terms.yml 没有、但界面中出现 3 次以上的术语
drive: unitatea；可移动驱动器 = unitate aldagarria，外部驱动器 = kanpoko unitatea（不用 Gidatu、diskoa）
disk-image: disko-irudia；drive image = unitate-irudia
boot: abiarazi（动词）；abioa（名词）；启动镜像 = abioko irudia，引导程序 = abio-kargatzailea
kernel: kernela；kernel 镜像 = kernel-irudia（不用 nukleoa，nukleo 留给 CPU 核心）
core: nukleo；CPU 核心 = PUZ nukleoak
ramdisk: RAM diskoa
display: pantaila
capture-input: sarrera harrapatu；名词 sarreraren harrapaketa（不用 atera、kaptura）
shared-directory: direktorio partekatua（shared folder 是 karpeta partekatua）
shortcut: lasterbidea（指向其他位置虚拟机的快捷方式；和 App 名 Lasterbideak 大小写区分）
dock: Dock（Apple 名称，保留；Dock-eko ikonoa）
guest-agent: gonbidatu-agentea
modifier-key: tekla aldatzailea
scan-code: eskaneatze-kodea
keystroke: tekla-sakatzea
vm-states: Abiarazi/Abiarazten/Abiarazita、Gelditu/Gelditzen/Geldituta、Pausatu/Pausatzen/Pausatuta、Eseki/Esekita（suspend）、Berrekin/Berrekiten（resume）、Leheneratu/Leheneratzen（restore）、Exekutatu（run）、Berrabiarazi（restart）
delete-remove-eject: Ezabatu（delete）、Kendu（remove）、Egotzi（eject）、Erauzten…（extracting）
gallery-library: Galeria（UTM Gallery 官网下载页）；UTM liburutegia（主窗口）
