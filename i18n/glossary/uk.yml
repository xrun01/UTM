# uk 定下的译法。键是 i18n/glossary/terms.yml 的术语 id。专有名词（Apple、Mac、macOS、Windows、Linux、QEMU、VM64、Rosetta）保留拉丁字母，不变格。
# 来源：amalthea（VM64 官网）的 glossary/uk.yml，commit b724790。去掉了官网专用的 ui-* 术语。
virtual-machine: віртуальна машина
guest: гість；客户机系统 = гостьова система；客户机工具 = гостьові інструменти（不用 клієнтські）
emulate: емулювати；емуляція（不用 симулювати、імітувати、моделювання）
virtualize: віртуалізувати；віртуалізація
native: нативний；接近原生的速度 = майже нативна швидкість（不用 рідна）
architecture: архітектура
backend: бекенд（不用 серверна частина）
apple-silicon: чип Apple；Apple 芯片的 Mac = комп’ютер Mac із чипом Apple  # https://support.apple.com/uk-ua/116943
intel-mac: комп’ютер Mac із процесором Intel  # https://support.apple.com/uk-ua/116943
snapshot: знімок
disposable-mode: одноразовий режим
shut-down: вимкнути；вимкнення
new-vm-wizard: майстер створення віртуальної машини
installer-image: інсталяційний образ
license: ліцензія
secure-boot: безпечне завантаження  # https://support.microsoft.com/uk-ua/windows/windows-11-and-secure-boot-a8ff1202-c0d9-42f5-940f-843abef64fad
or-later: або новіша версія；作宾语时用属格 або новішої версії（不用 вище、пізніша）  # https://support.apple.com/uk-ua/102552（「macOS Ventura або новішої версії」）
experimental: експериментальна функція
auto-resolution: автоматичне налаштування роздільної здатності
shared-clipboard: спільний буфер обміну；共享剪贴板（动作）= спільний доступ до буфера обміну
shared-folder: спільна папка；共享文件夹（动作）= надати спільний доступ до папки
sharing: Спільний доступ
shared-network: Спільна мережа
host-only: Лише хост
bridged: Мережевий міст
emulated-vlan: Емульована VLAN
port-forwarding: переадресація портів
lan: локальна мережа
shortcuts: Швидкі команди（програма «Швидкі команди»，不用 ярлики）  # https://support.apple.com/uk-ua/guide/shortcuts-mac/welcome/mac
command-line-tool: інструмент командного рядка
clone: клонувати
fingerprint: відбиток ключа（不用 відбиток пальця）
hardware-reset: апаратне скидання
mount: змонтувати（不用 підключити，它也表示连接）
shared-library: спільна бібліотека
capture-mouse: захопити мишу；捕获鼠标按钮 = кнопка «Захопити мишу»
keys: клавіша Control、клавіша Option  # https://support.apple.com/uk-ua/102650
toolbar: панель інструментів
settings: параметри（不用 налаштування）  # Apple 乌克兰语「Системні параметри」：https://support.apple.com/uk-ua/guide/mac-help/mchlp1225/mac
classic-systems: класичні системи
install: інсталювати；安装（名词）= інсталяція（不用 встановити、установити、встановлення）  # https://support.apple.com/uk-ua/102527（「Як інсталювати транслятор Rosetta」）
rosetta: Rosetta，不变格；需要中心词时写 транслятор Rosetta  # https://support.apple.com/uk-ua/102527
cpu: ЦП；CPU Cores = Ядра ЦП  # https://support.apple.com/uk-ua/guide/activity-monitor/welcome/mac
# 以下是 2026-11 审校时新定的界面术语（terms.yml 中没有）
image: образ（磁盘或安装映像文件；Drive Image = Образ диска，不写 зображення）
drive: диск；Removable Drive = Знімний диск，External Drive = Зовнішній диск
display: дисплей；Displays = Дисплеї
directory: каталог；Shared Directory = Спільний каталог，Directory sharing = Спільний доступ до каталогів（shared folder 仍是 спільна папка）
download: завантажити；名词 завантаження（Apple 写法。Boot 也是 завантаження，只用于系统启动：Boot Image = Завантажувальний образ）
pause: пауза；Pause = Пауза，Paused = На паузі，Pausing = Постановка на паузу（和 suspend 区分）
suspend: призупинити；Suspend = Призупинити，Suspended = Призупинено，suspended state = стан призупинення
resume: продовжити роботу；Resume = Продовжити，Resuming = Продовження роботи（和 restore 区分）
restore: відновити；Restore = Відновити，Restoring = Відновлення（从快照恢复）
delete: видалити（永久删除）；remove = вилучити（移除快捷方式、共享目录），两者区分
eject: вийняти（不写 видалити）；Extracting… = Розпакування…
kill: примусово завершити；Kill（停止方式）= Завершення процесу，Force = Примусове вимкнення，Request = Запит
serial: послідовний порт（不写 серійний номер）
shortcut: ярлик（指向别处虚拟机的快捷方式，不是快捷指令 App）
memory: пам’ять；RAM = ОЗП；storage = сховище（internal storage = внутрішнє сховище），两者区分
screenshot: знімок екрана（不写 скріншот）
custom: власний；generic = стандартний；default = за замовчуванням（三者区分）
dock: Dock（значок у Dock，不写 док-станція）
menu-bar: рядок меню
vm-short: 不用缩写 ВМ，写 віртуальна машина
punctuation: 撇号用 ’（U+2019）；引号用 «»
