# uz 定下的译法。键是 i18n/glossary/terms.yml 的术语 id。用拉丁字母，o'、g' 用 ASCII 撇号 '。专有名词（Apple、Mac、macOS、Windows、Linux、QEMU、VM64、Rosetta）保留拉丁字母，词尾用连字符：Mac-da、Rosetta-ni。
# 来源：amalthea（VM64 官网）的 glossary/uz.yml，commit b724790。去掉了官网专用的 ui-* 术语。
# support.apple.com/uz-uz 和 support.microsoft.com/uz-latn-uz 都返回英文。rule 是 apple、microsoft 的术语按乌兹别克语软件界面的通行说法写，待母语者确认。
virtual-machine: virtual mashina
guest: mehmon；客户机系统 = mehmon tizim；客户机工具 = mehmon vositalari（不用 mijoz）
emulate: emulyatsiya qilmoq；emulyatsiya（不用 taqlid、simulyatsiya）
virtualize: virtualizatsiya qilmoq；virtualizatsiya
native: nativ；接近原生的速度 = nativga yaqin tezlik（不用 mahalliy，它是「本地的」）  # 待确认
architecture: arxitektura；CPU 架构 = protsessor arxitekturasi
backend: backend；QEMU backendi、Apple backendi
apple-silicon: Apple chipi；Apple 芯片的 Mac = Apple chipli Mac（不用 Apple silicon、Apple silikon）  # https://support.apple.com/uz-uz/116943 返回英文，查不到官方写法
intel-mac: Intel protsessorli Mac  # 同上
snapshot: snapshot；复数 snapshotlar（不用 surat、oniy tasvir）  # 待确认
disposable-mode: bir martalik rejim（不用 tashlab yuborish rejimi）
shut-down: o'chirish
new-vm-wizard: virtual mashina yaratish ustasi（不用 yangi usta）
installer-image: o'rnatish tasviri（不用 rasm）  # 沿用原译，待确认
license: litsenziya；自备许可证 = o'z litsenziyangiz
secure-boot: Secure Boot（保留拉丁字母）  # support.microsoft.com/uz-latn-uz 返回英文，沿用原译，待确认
or-later: yoki undan keyingi versiyasi（不用 yoki undan yuqori）
experimental: eksperimental funksiya（不用 xususiyat）
auto-resolution: ekran ruxsatini avtomatik sozlash（ruxsat 必须带 ekran，否则读成「许可」）
shared-clipboard: umumiy almashuv buferi；共享剪贴板（动作）= almashuv buferini ulashish（不用 clipboard、almashish xotirasi）
shared-folder: umumiy papka；共享文件夹（动作）= papkalarni ulashish
sharing: Ulashish（不用 almashish、baham ko'rish、birgalikda）
shared-network: Umumiy tarmoq
host-only: Faqat xost
bridged: Tarmoq ko'prigi
emulated-vlan: Emulyatsiya qilingan VLAN
port-forwarding: portlarni yo'naltirish
lan: lokal tarmoq（不用 LAN）
shortcuts: Shortcuts ilovasi（不用 Yorliqlar）  # Apple 无 uz 界面，待确认
command-line-tool: buyruq qatori vositasi
clone: klonlash
fingerprint: kalit izi（不用 barmoq izi）  # 待确认
hardware-reset: apparatni asl holatiga qaytarish
mount: fayl tizimiga ulash（不用 o'rnatish，它表示安装）
shared-library: umumiy kutubxona
capture-mouse: sichqonchani ushlash；捕获鼠标按钮 = “Sichqonchani ushlash” tugmasi
keys: Control tugmasi、Option tugmasi（键名不翻译）
toolbar: asboblar paneli
settings: sozlamalar
rosetta: Rosetta；词尾用连字符：Rosetta-ni
cpu: protsessor
classic-systems: klassik tizimlar
# 标题、步骤标题、列表标签和链接用动名词（-ish），号召句（band）用祈使句。
