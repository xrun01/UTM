# tr 定下的译法。规则见 i18n/glossary/terms.yml。
# 来源：amalthea（VM64 官网）的 glossary/tr.yml，commit b724790。去掉了官网专用的 ui-* 术语。
virtual-machine: sanal makine
guest: konuk；客户机系统 = konuk işletim sistemi；客户机工具 = konuk araçları
emulate: emüle etmek；emülasyon（不用 taklit、öykünme、simülasyon）
virtualize: sanallaştırmak；sanallaştırma
native: yerel；接近原生的速度 = yerel hıza yakın hız
architecture: mimari；CPU 架构 = CPU mimarisi
backend: arka uç；QEMU arka ucu、Apple arka ucu
apple-silicon: Apple çip；Apple 芯片的 Mac = Apple çipli Mac  # https://support.apple.com/tr-tr/116943
intel-mac: Intel işlemcili Mac  # https://support.apple.com/tr-tr/116943
snapshot: anlık görüntü
disposable-mode: tek kullanımlık mod
shut-down: kapatmak；kapatma
new-vm-wizard: yeni sanal makine sihirbazı
installer-image: kurulum görüntüsü（不用 imaj）
license: lisans
secure-boot: Güvenli Önyükleme  # https://support.microsoft.com/tr-tr/windows/windows-11-and-secure-boot-a8ff1202-c0d9-42f5-940f-843abef64fad
or-later: veya sonraki sürümler（不用 veya üzeri、veya üstü）  # https://support.apple.com/tr-tr/102552（「macOS Ventura veya sonraki sürümlerinde」）
experimental: deneysel özellik
auto-resolution: otomatik çözünürlük ayarı
shared-clipboard: paylaşılan pano；复制和粘贴 = kopyalamak ve yapıştırmak  # https://support.apple.com/tr-tr/guide/mac-help/mchl70368996/mac（「Düzen > Yapıştır」）
shared-folder: paylaşılan klasör
sharing: Paylaşım
shared-network: Paylaşılan Ağ
host-only: Yalnızca Ana Bilgisayar
bridged: Köprü
emulated-vlan: Emüle Edilmiş VLAN
port-forwarding: bağlantı noktası yönlendirme
lan: yerel ağ
shortcuts: Kestirmeler  # https://support.apple.com/tr-tr/guide/shortcuts-mac/welcome/mac
command-line-tool: komut satırı aracı
clone: klonlamak
fingerprint: parmak izi
hardware-reset: donanım sıfırlama
mount: dosya sistemine bağlamak（不单写 bağlamak，避免和连接设备混淆）
shared-library: paylaşılan kitaplık
capture-mouse: fareyi yakalamak；捕获鼠标按钮 = Fareyi Yakala düğmesi（待确认 App 界面）
keys: Kontrol tuşu、Option tuşu、Komut tuşu、Shift、Caps Lock、Esc  # https://support.apple.com/tr-tr/102650（「Kontrol (veya Ctrl)」「Option (veya Alt)」「Komut (veya Cmd)」「Esc (Escape)」）
toolbar: araç çubuğu
settings: ayarlar
rosetta: Rosetta，按土耳其语用撇号加词尾：Rosetta'yı、Rosetta'nın
cpu: CPU；CPU 架构 = CPU mimarisi；CPU 核心 = CPU çekirdeği  # https://support.apple.com/tr-tr/guide/activity-monitor/actmntr43452/mac（界面标签写「CPU」）
classic-systems: klasik sistemler
# 以下是待审条目中出现 3 次以上的界面术语（terms.yml 没有），本轮审校定下
device: cihaz（不用 aygıt；全部条目统一）
drive: sürücü；驱动器映像 = sürücü görüntüsü
image: görüntü（磁盘映像、启动映像；不用 resim、görsel、imaj）
format: biçim；映像格式 = görüntü biçimi
configuration: yapılandırma（不用 konfigürasyon）
install: yüklemek；名词「安装」作标题时 = kurulum（Kurulum Yöntemi、Kurulum Kılavuzu）
host: ana bilgisayar；主机网络 = Ana Bilgisayar Ağları
display: ekran；多个显示器 = Ekranlar
input: giriş；捕获输入 = Girişi Yakala
pause: duraklatmak；Paused = Duraklatıldı
suspend: askıya almak；Suspended = Askıya alındı（和 pause 不同词）
resume: sürdürmek；Resuming = Sürdürülüyor（不用 devam ettirmek；和 Restore = Geri Yükle 区分）
kill: sonlandırmak；Force kill = Zorla sonlandır
directory: dizin；folder = klasör（英文分开用，译文也分开）
vm-shortcut: kısayol（UTM 里指向别处虚拟机的快捷方式；和 Kestirmeler App、klavye kestirmesi 区分）
cancel-button: Vazgeç（按钮）；OK = Tamam
macos-suffix: macOS'i、macOS'in（按 Apple 读音加词尾）  # https://support.apple.com/tr-tr/102655（「macOS'i」）
