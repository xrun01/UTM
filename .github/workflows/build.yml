name: Build
on:
  push:
    branches:
      - main
    paths-ignore:
      - LICENSE
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-win-guest:
    name: Build Windows Guest Tools
    runs-on: windows-latest
    steps:
      - name: Checkout vm repository
        uses: actions/checkout@v7
        with:
          repository: xrun01/vm
          token: ${{ secrets.GH_TOKEN }}
          path: git/vm
      - name: Setup latest MSVC ARM64 toolchain
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64_arm64
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Ensure LLVM, Zstd, and Rust ARM64 Windows Target
        shell: bash
        run: |
          [ -f "/c/Program Files/LLVM/bin/llvm-dlltool.exe" ] || which llvm-dlltool || choco install llvm -y --no-progress
          which zstd || choco install zstd -y --no-progress
          rustup target add aarch64-pc-windows-msvc
      - name: Cache Windows Guest Tools Build
        id: cache-win-guest
        uses: actions/cache@v6
        with:
          path: |
            git/vm/engine/build/GuestTools
            git/vm/rs/setup/target
          key: win-guest-${{ runner.os }}-${{ hashFiles('git/vm/guest/**', 'git/vm/rs/setup/**', 'git/vm/engine/include/**', 'git/vm/script/**') }}
      - name: Restore Cached Build Timestamps
        if: steps.cache-win-guest.outputs.cache-hit == 'true'
        shell: bash
        run: |
          find git/vm/engine/build/GuestTools -type f -exec touch {} +
      - name: Build Windows 11 ARM64 Guest Modules
        run: bun git/vm/script/winGuestBuild.js
      - name: Pack Windows Guest Tools with Zstd
        shell: bash
        run: |
          tar -C git/vm/engine/build/GuestTools/stage -cf - . | zstd -19 -T0 -o win-guest-tools.tar.zst
      - name: Upload Windows Guest Tools Artifact
        uses: actions/upload-artifact@v7
        with:
          name: win-guest-tools
          path: win-guest-tools.tar.zst
          compression-level: 0

  build-mac-engine:
    name: Build macOS VM Engine
    runs-on: macos-latest
    steps:
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Checkout UTM repository
        uses: actions/checkout@v7
        with:
          path: git/UTM
      - name: Checkout vm repository
        uses: actions/checkout@v7
        with:
          repository: xrun01/vm
          token: ${{ secrets.GH_TOKEN }}
          path: git/vm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Ensure Ninja and Zstd
        run: |
          which ninja || brew install ninja
          which zstd || brew install zstd
      - name: Cache macOS VM Engine Build
        id: cache-mac-engine
        uses: actions/cache@v6
        with:
          path: |
            git/vm/engine/build/VmApp
            git/vm/engine/build/MonitorArm
          key: mac-engine-${{ runner.os }}-${{ hashFiles('git/vm/engine/VmApp/**', 'git/vm/engine/MonitorArm/**', 'git/vm/engine/include/**', 'git/vm/bridge/**', 'git/vm/headless/**', 'git/vm/script/**') }}
      - name: Restore Cached Engine Timestamps
        if: steps.cache-mac-engine.outputs.cache-hit == 'true'
        run: |
          find git/vm/engine/build/VmApp git/vm/engine/build/MonitorArm -type f -exec touch {} + 2>/dev/null || true
      - name: Build macOS VM SDK
        env:
          XVM_JOBS: "8"
        run: |
          bun git/vm/script/build.js
          tar -C git/UTM/lib -cf - libvmkit.a libMonitorArm.dylib efia64.bin vm-mcp | zstd -19 -T0 -o mac-vm-sdk.tar.zst
      - name: Upload macOS VM SDK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-vm-sdk
          path: mac-vm-sdk.tar.zst
          compression-level: 0

  # 本地化检查仅依赖 macOS 引擎产物，使用空客户机驱动目录完成字符串提取与校验，
  # 不阻塞于 Windows 客户机工具构建，确保每个 PR 的多语言目录与源码保持同步
  check-localizations:
    name: Check Localizations
    runs-on: macos-latest
    needs: [build-mac-engine]
    steps:
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Checkout UTM repository
        uses: actions/checkout@v7
        with:
          path: git/UTM
      - name: Checkout vm repository
        uses: actions/checkout@v7
        with:
          repository: xrun01/vm
          token: ${{ secrets.GH_TOKEN }}
          path: git/vm
      - name: Download macOS VM SDK
        uses: actions/download-artifact@v8
        with:
          name: mac-vm-sdk
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Build UTM.app for String Extraction
        run: |
          which zstd || brew install zstd
          mkdir -p git/vm/engine/build/GuestTools/stage git/UTM/lib
          zstd -d -c mac-vm-sdk.tar.zst | tar -C git/UTM/lib -xf -
          chmod +x git/UTM/lib/vm-mcp git/UTM/lib/libMonitorArm.dylib
          touch git/UTM/lib/libvmkit.a git/UTM/lib/vm-mcp git/UTM/lib/libMonitorArm.dylib git/UTM/lib/efia64.bin
          bun git/vm/script/buildApp.js
      - name: Test and Check Localizations
        working-directory: git/UTM/scripts/i18n
        run: |
          bun install
          bun test
          bun check.js --ci
          bun install --cwd ../../../vm/script
          bun ../../../vm/script/i18nCheck.js

  package-utm-app:
    name: Package UTM.app
    runs-on: macos-latest
    needs: [build-win-guest, build-mac-engine]
    steps:
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Checkout UTM repository
        uses: actions/checkout@v7
        with:
          path: git/UTM
      - name: Checkout vm repository
        uses: actions/checkout@v7
        with:
          repository: xrun01/vm
          token: ${{ secrets.GH_TOKEN }}
          path: git/vm
      - name: Download Windows Guest Tools
        uses: actions/download-artifact@v8
        with:
          name: win-guest-tools
      - name: Download macOS VM SDK
        uses: actions/download-artifact@v8
        with:
          name: mac-vm-sdk
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Build and Sign UTM.app
        run: |
          which zstd || brew install zstd
          mkdir -p git/vm/engine/build/GuestTools/stage git/UTM/lib
          zstd -d -c win-guest-tools.tar.zst | tar -C git/vm/engine/build/GuestTools/stage -xf -
          zstd -d -c mac-vm-sdk.tar.zst | tar -C git/UTM/lib -xf -
          chmod +x git/UTM/lib/vm-mcp git/UTM/lib/libMonitorArm.dylib
          touch git/UTM/lib/libvmkit.a git/UTM/lib/vm-mcp git/UTM/lib/libMonitorArm.dylib git/UTM/lib/efia64.bin
          rm -f git/UTM/lib/GuestTools.iso git/vm/engine/build/GuestTools/GuestTools.iso
          bun git/vm/script/buildApp.js
          git/UTM/build/UTM.app/Contents/MacOS/vm-mcp --list-tools > /dev/null
          tar -C git/UTM/build -cf - UTM.app | zstd -19 -T0 -o UTM.app.tar.zst
      - name: Upload UTM.app Artifact
        uses: actions/upload-artifact@v7
        with:
          name: UTM.app
          path: UTM.app.tar.zst
          compression-level: 0
