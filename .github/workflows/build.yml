name: Build
on:
  push:
    branches:
      - main
      - xvm
    paths-ignore:
      - LICENSE
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  build-win-guest:
    name: Build Windows Guest Tools
    runs-on: windows-latest
    steps:
      - name: Checkout vm repository
        uses: actions/checkout@v4
        with:
          repository: xrun01/vm
          token: ${{ secrets.GH_TOKEN }}
          path: git/vm
      - name: Setup MSVC ARM64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Build Windows 11 ARM64 Guest Modules
        run: bun git/vm/script/winGuestBuild.js
      - name: Upload Windows Guest Tools Artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-guest-tools
          path: git/vm/engine/build/GuestTools/stage

  build-mac-engine:
    name: Build macOS VM Engine
    runs-on: macos-15
    steps:
      - name: Checkout UTM repository
        uses: actions/checkout@v4
        with:
          path: git/UTM
      - name: Checkout vm repository
        uses: actions/checkout@v4
        with:
          repository: xrun01/vm
          token: ${{ secrets.GH_TOKEN }}
          path: git/vm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Ensure Ninja
        run: which ninja || brew install ninja
      - name: Build macOS VM SDK
        run: bun git/vm/script/build.js
      - name: Upload macOS VM SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-vm-sdk
          path: |
            git/UTM/lib/libvmkit.a
            git/UTM/lib/libMonitorArm.dylib
            git/UTM/lib/efia64.bin
            git/UTM/lib/vm-mcp

  package-utm-app:
    name: Package UTM.app
    runs-on: macos-15
    needs: [build-win-guest, build-mac-engine]
    steps:
      - name: Checkout UTM repository
        uses: actions/checkout@v4
        with:
          path: git/UTM
      - name: Checkout vm repository
        uses: actions/checkout@v4
        with:
          repository: xrun01/vm
          token: ${{ secrets.GH_TOKEN }}
          path: git/vm
      - name: Download Windows Guest Tools
        uses: actions/download-artifact@v4
        with:
          name: win-guest-tools
          path: git/vm/engine/build/GuestTools/stage
      - name: Download macOS VM SDK
        uses: actions/download-artifact@v4
        with:
          name: mac-vm-sdk
          path: git/UTM/lib
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Build and Sign UTM.app
        run: |
          chmod +x git/UTM/lib/vm-mcp git/UTM/lib/libMonitorArm.dylib
          rm -f git/UTM/lib/GuestTools.iso git/vm/engine/build/GuestTools/GuestTools.iso
          bun git/vm/script/buildApp.js
          git/UTM/build/UTM.app/Contents/MacOS/vm-mcp --list-tools > /dev/null
          ditto -c -k --sequesterRsrc --keepParent git/UTM/build/UTM.app UTM.app.zip
      - name: Upload UTM.app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTM.app
          path: UTM.app.zip
